[project]
name = "autobiographical-blind-extraction"
version = "0.1.0"
description = "Pre-registered, blind, two-lineage trait extraction from a diary or autobiography"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PLW", "RUF"]
ignore = ["RUF001"]  # report text uses α, en dashes and the removal mark on purpose
